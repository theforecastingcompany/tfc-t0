[project]
name = "tfc-t0"
version = "0.3.1"
description = "Open-weights time-series forecasting foundation model from The Forecasting Company"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The Forecasting Company" }]
keywords = [
    "time-series",
    "forecasting",
    "foundation-model",
    "transformer",
    "probabilistic-forecasting",
    "huggingface",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Floor-only version constraints: we pin the minimum versions we've tested
    # against but deliberately avoid upper caps, so downstream integrators
    # (e.g. Darts, which depends on tfc-t0 as an optional extra) can resolve
    # newer releases without being blocked. If a future major release breaks
    # us, bump the floor instead of reintroducing a cap.
    "torch>=2.4",
    # einops floor at 0.7: t0 only uses rearrange/repeat (stable since 0.7),
    # and downstream integrators (e.g. timecopilot via uni2ts) pin
    # einops==0.7.*. Test suite verified against both 0.7.0 and 0.8.x.
    "einops>=0.7",
    # rotary-embedding-torch is verified against the 0.8.x line in NOTICE.
    "rotary-embedding-torch>=0.8",
    "huggingface-hub>=1",
    "safetensors>=0.4",
    # numpy: required by safetensors.torch.save_file/load_file at runtime
    # (it uses np.prod for buffer sizing); also accepted as input by predict()
    # via duck typing (no import in t0/ code).
    "numpy>=1.26",
    # jaxtyping: shape-annotated tensor signatures (annotations only — no
    # runtime checker is installed, so there is no runtime cost). Floor at
    # 0.2.24 for coexistence with packages that pin jaxtyping<0.3 (e.g.
    # uni2ts, pulled in alongside t0 by timecopilot).
    "jaxtyping>=0.2.24",
    # typing-extensions backports typing.Self (PEP 673) to Python 3.10. On
    # 3.11+ Self comes from the stdlib, so the marker keeps this off the
    # dependency set there (it's still present transitively via torch).
    "typing-extensions>=4 ; python_version < '3.11'",
]

[project.optional-dependencies]
# t0.evaluation — GluonTS-style predictor for benchmark evaluation.
evaluation = ["gluonts>=0.15", "tqdm>=4.66"]
# t0.utils — forecast plotting with the t0-alpha (Retrocast) style.
plot = ["matplotlib>=3.8"]
# notebooks/ — for running the example Jupyter notebooks (inference + LoRA).
notebooks = ["peft>=0.11", "accelerate>=0.30", "ipykernel>=6.29", "matplotlib>=3.8", "pandas>=2", "pyarrow>=14"]

[project.urls]
Homepage = "https://huggingface.co/theforecastingcompany/t0-alpha"
Source = "https://github.com/theforecastingcompany/tfc-t0"
Issues = "https://github.com/theforecastingcompany/tfc-t0/issues"
Documentation = "https://huggingface.co/theforecastingcompany/t0-alpha"
Changelog = "https://github.com/theforecastingcompany/tfc-t0/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.17",
]
# Tools required by the internal CLIs under tools/. Not imported by the
# t0/ package itself.
internal = [
    # Source .ckpt pickles OmegaConf objects; torch.load needs the class
    # on the import path to unpickle (convert_checkpoint.py).
    "omegaconf>=2.3",
    # YAML frontmatter validation in push_to_hf.py's public preflight.
    "pyyaml>=6",
]
# GIFT-eval benchmark evaluation (notebooks/t0-alpha.ipynb + tools/evaluate_gift_eval.py).
gift-eval = [
    "tfc-t0[evaluation,plot]",  # gluonts / tqdm / matplotlib, also required by gift-eval
    "salesforce-gift-eval",
    "datasets>=4",  # required by gift-eval
    "pandas>=2",  # required by gift-eval
    "pyarrow>=14",  # required by gift-eval
    "python-dotenv>=1",  # required by gift-eval
    "toolz>=0.12",  # required by gift-eval
    "ipykernel>=6.29",
    "jupyterlab>=4.5.7",
]

[tool.uv.sources]
# Pinned to a known-good revision of the upstream GIFT-eval benchmark repo.
salesforce-gift-eval = { git = "https://github.com/SalesforceAIResearch/gift-eval.git", rev = "b34ea78bc33fa6bd3aaad2851cfab84d4191c077" }

[tool.uv]
# Supply-chain hygiene: quarantine newly-published versions for 7 days.
exclude-newer = "P7D"

# gift-eval is a library that pins outdated dependencies, so make uv ignore them.
# What it actually imports is declared in the gift-eval group above.
[[tool.uv.dependency-metadata]]
name = "salesforce-gift-eval"
version = "0.0.0a0"
requires-dist = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the t0/ package ships in the wheel. Internal tooling (tools/) and
# tests (tests/) are deliberately excluded — guarded by test_wheel.py.
# LICENSE + NOTICE are picked up automatically via [project.license-files].
packages = ["t0"]

[tool.hatch.build.targets.sdist]
# The MLX runtime is a separate distribution built from mlx/pyproject.toml.
exclude = ["/mlx"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# F722: jaxtyping's string shape annotations are not forward references.
# See https://docs.kidger.site/jaxtyping/faq/#flake8-or-ruff-are-throwing-an-error
ignore = ["E501", "F722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.rules]
# rope.py is a verbatim port from upstream Datadog Toto. The two known
# false-positives below come from the upstream code; the port is kept
# mechanical so they aren't worth fixing locally.
invalid-method-override = "ignore"
unsupported-operator = "ignore"
